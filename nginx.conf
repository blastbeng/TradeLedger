server {
    listen 80;
    server_name yourdomain.com; # Change this to your domain or IP

    # Serve static files directly via Nginx (optional, but recommended for performance)
    # Uncomment and adjust the alias path to match your project's absolute path
    # location /static/ {
    #     alias /path/to/your/project/src/web/static/;
    #     expires 30d;
    # }

    location /ws {
        proxy_pass http://127.0.0.1:8000; # Change port if your WEB_PORT is different
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts for long-lived WebSocket connections
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location / {
        proxy_pass http://127.0.0.1:8000; # Change port if your WEB_PORT is different
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
