services:
  redis:
    image: redis:7-alpine
    container_name: trade-ledger-redis
    restart: no
    ports:
      - "63795:6379"
    volumes:
      - redis_data:/data
    environment:
      - TZ=Europe/Rome
      - PUID=1000
      - PGID=1000
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  tor:
    image: dperson/torproxy
    container_name: trade-ledger-tor
    restart: no
    ports:
      - "8118:8118"

  postgres:
    image: postgres:16-alpine
    container_name: trade-ledger-postgres
    restart: no
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-trade_ledger}
      POSTGRES_USER: ${DB_USER:-trade_ledger}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-trade_ledger} -d ${DB_NAME:-trade_ledger}"]
      interval: 10s
      timeout: 5s
      retries: 5

  bot:
    build: .
    container_name: trade-ledger
    pull_policy: build
    restart: no
    ports:
      - "8083:8083"
    env_file:
      - .env
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Rome
      - HOME=/app/data
    user: "${PUID:-1000}:${PGID:-1000}"
    depends_on:
      redis:
        condition: service_healthy
      tor:
        condition: service_started
      postgres:
        condition: service_healthy
    volumes:
      - ./src:/app/src   # for development hot-reload (optional)
      - ./data:/app/data

volumes:
  redis_data:
  postgres_data:

