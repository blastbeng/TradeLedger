---
services:
  postgres:
    image: postgres:16-alpine
    container_name: trade-ledger-postgres
    restart: no
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-trade_ledger}
      POSTGRES_USER: ${DB_USER:-trade_ledger}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-}
      TZ: Europe/Rome
      PUID: 1000
      PGID: 1000
    volumes:
      - ./postgresql/data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-trade_ledger} -d ${DB_NAME:-trade_ledger}"]
      interval: 10s
      timeout: 5s
      retries: 5

  bot:
    build: .
    container_name: trade-ledger
    pull_policy: build
    restart: no
    ports:
      - "8083:8083"
    env_file:
      - .env
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Rome
      - HOME=/app/data
    user: "${PUID:-1000}:${PGID:-1000}"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./src:/app/src   # for development hot-reload (optional)
      - ./data:/app/data

